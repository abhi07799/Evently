spring.application.name=Evently
server.port=8080
server.servlet.context-path= /api/v1

#DB Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/evently
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#CUSTOM SWAGGER UI PATH
springdoc.swagger-ui.path=/evently

#PAGINATION CONFIG
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

#OAUTH2 CONFIG
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/Evently

# Swagger OAuth2 Authorization Code flow with PKCE.
springdoc.swagger-ui.oauth.client-id=Evently-Swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,profile,email

# Must match the redirect URI configured in Keycloak.
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8080/api/v1/swagger-ui/oauth2-redirect.html

# Keycloak Admin API configuration
keycloak.server-url=http://localhost:9090
keycloak.realm=Evently
keycloak.admin.client-id=Evently-Service
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET}